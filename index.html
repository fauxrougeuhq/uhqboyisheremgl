<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>@fauxrouge</title>
  <link rel="stylesheet" href="style.css" />
  <base href="./" />
  <link rel="icon" href="data:," />
</head>
<body>
  <video id="bgVideo" class="bg-video" autoplay loop muted playsinline preload="metadata">
    <source src="./assets/bg.mp4" type="video/mp4" />
  </video>

  <div class="overlay"></div>
  <canvas id="snowCanvas" class="snow-canvas"></canvas>
  <canvas id="mouseCanvas" class="mouse-canvas"></canvas>

  <audio id="bgAudio" src="./assets/music.mp3" loop preload="none"></audio>

  <div class="volume-ui">
    <svg class="vol-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none" />
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
    </svg>
    <div class="vol-bar">
      <label class="sr-only" for="volumeSlider">Volume</label>
      <div class="vol-fill" id="volFill"></div>
      <input id="volumeSlider" type="range" min="0" max="1" step="0.01" value="0.35" aria-label="Volume" />
    </div>
  </div>

  <div class="enter-overlay" id="enterOverlay">
    <button class="enter-btn" id="enterBtn" type="button" aria-label="Entrer">♰</button>
  </div>

  <main class="ui" id="ui">
    <section class="profile">
      <img class="avatar-big" src="./assets/avatar.gif" alt="Avatar" />

      <div class="profile-text">
        <div class="name-row">
          <h1 class="username shimmer">fauxrouge</h1>
          <div class="mini-icons" aria-hidden="true">
            <span>●</span><span>♡</span><span>✦</span><span>$</span><span>♣</span>
          </div>
        </div>

        <p class="subtitle shimmer" id="subtitle"></p>
      </div>
    </section>

    <section class="cards-row">
      <div class="glass-card" id="discordCard">
        <img class="avatar-small" id="discordAvatar" src="./assets/avatar.gif" alt="Avatar Discord" />
        <div class="card-text">
          <div class="card-title" id="discordName">Discord</div>
          <div class="card-sub" id="discordLine">loading...</div>
        </div>
        <div class="status-dot" id="discordDot"></div>
      </div>

      <div class="glass-card" id="ytCard">
        <img class="avatar-small" src="./assets/avatar.gif" alt="Avatar YouTube" />
        <div class="card-text">
          <div class="card-title">YouTube</div>
          <div class="card-sub" id="ytSubs">loading...</div>
          <a class="pill-btn" id="ytBtn" href="https://www.youtube.com/channel/UCd9ThgV9m9ksRpLVit9JS3w" target="_blank" rel="noopener noreferrer">View Channel</a>
        </div>
      </div>
    </section>

    <section class="socials-row">
      <a href="https://www.tiktok.com/@amplieboy" target="_blank" rel="noopener noreferrer" aria-label="TikTok" class="social-link">
        <svg viewBox="0 0 24 24" class="social-icon" aria-hidden="true">
          <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74a2.89 2.89 0 0 1 2.31-4.64a2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z" />
        </svg>
      </a>

      <a href="https://t.me/tmaxeth" target="_blank" rel="noopener noreferrer" aria-label="Telegram" class="social-link">
        <svg viewBox="0 0 24 24" class="social-icon" aria-hidden="true">
          <path d="m20.665 3.717l-17.73 6.837c-1.21.486-1.203 1.161-.222 1.462l4.552 1.42l10.532-6.645c.498-.303.953-.14.579.192l-8.533 7.701h-.002l.002.001l-.314 4.692c.46 0 .663-.211.921-.46l2.211-2.15l4.599 3.397c.848.467 1.457.227 1.668-.785l3.019-14.228c.309-1.239-.473-1.8-1.282-1.434z" />
        </svg>
      </a>

      <a href="https://discord.gg/synapsis" target="_blank" rel="noopener noreferrer" aria-label="Discord" class="social-link">
        <svg viewBox="0 0 24 24" class="social-icon" aria-hidden="true">
          <path d="M14.82 4.26a10.14 10.14 0 0 0-.53 1.1a14.66 14.66 0 0 0-4.58 0a10.14 10.14 0 0 0-.53-1.1a16 16 0 0 0-4.13 1.3a17.33 17.33 0 0 0-3 11.59a16.6 16.6 0 0 0 5.07 2.59A12.89 12.89 0 0 0 8.23 18a9.65 9.65 0 0 1-1.71-.83a3.39 3.39 0 0 0 .42-.33a11.66 11.66 0 0 0 10.12 0q.21.18.42.33a10.84 10.84 0 0 1-1.71.84a12.41 12.41 0 0 0 1.08 1.78a16.44 16.44 0 0 0 5.06-2.59a17.22 17.22 0 0 0-3-11.59a16.09 16.09 0 0 0-4.09-1.35zM8.68 14.81a1.94 1.94 0 0 1-1.8-2a1.93 1.93 0 0 1 1.8-2a1.93 1.93 0 0 1 1.8 2a1.93 1.93 0 0 1-1.8 2zm6.64 0a1.94 1.94 0 0 1-1.8-2a1.93 1.93 0 0 1 1.8-2a1.92 1.92 0 0 1 1.8 2a1.92 1.92 0 0 1-1.8 2z" />
        </svg>
      </a>

      <a href="https://stake.bz/?offer=fauxrouge&amp;c=kMDU9WvE" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="Stake">
        <img src="./assets/stake.webp" class="social-icon-img stake-icon" alt="Stake" />
      </a>
    </section>

    <section class="meta">
      <div class="meta-item">👁 <span id="views">0</span></div>
      <div class="meta-sep">|</div>
      <div class="meta-item">📍 France</div>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
